<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Reproductive System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@400;700&display=swap');

        :root {
            --primary: #102138;
            --accent-male: #1c8de7;
            --accent-female: #d63a66;
            --bg: #e8efe9;
            --glass: rgba(255, 255, 255, 0.78);
            --ink-soft: #5c6772;
            --panel-shadow: 0 16px 40px rgba(16, 33, 56, 0.15);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(circle at 15% 20%, #f4fff8, #e8efe9 35%, #d7e4de 100%);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 1.15rem 1rem;
            background: linear-gradient(125deg, #0e1d33, #1b3556 60%, #244767);
            color: white;
            width: 100%;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
            position: relative;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.03em;
            margin: 0;
            font-weight: 800;
            font-size: clamp(1.25rem, 2.8vw, 1.95rem);
        }

        .toggle-container {
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: flex-start;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 25px;
            transition: 0.28s ease;
            font-weight: bold;
            box-shadow: 0 8px 16px rgba(16, 33, 56, 0.18);
        }

        .btn-male { background: var(--accent-male); color: white; }
        .btn-female { background: var(--accent-female); color: white; }
        .btn:hover { opacity: 0.88; transform: translateY(-3px) scale(1.02); }

        .btn.is-active {
            outline: 3px solid rgba(255, 255, 255, 0.72);
            outline-offset: 2px;
            transform: translateY(-2px);
        }

        .view-toggle {
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: flex-start;
        }

        .view-toggle.hidden {
            display: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.82);
            color: #213449;
        }

        .btn-secondary.is-active {
            background: #ffffff;
            outline: 3px solid rgba(16, 33, 56, 0.14);
        }

        .btn:focus-visible {
            outline: 3px solid rgba(16, 33, 56, 0.35);
            outline-offset: 2px;
        }

        .status-pill {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(16, 33, 56, 0.14);
            color: #213449;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 0.9rem;
            box-shadow: 0 6px 12px rgba(16, 33, 56, 0.09);
            margin: 2px 0 0;
        }

        .controls-instruction {
            margin: 2px 0 0;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px dashed rgba(16, 33, 56, 0.2);
            color: #33485f;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        main {
            display: grid;
            grid-template-columns: minmax(230px, 280px) minmax(0, 1fr);
            gap: 20px;
            max-width: 1160px;
            width: min(95%, 1160px);
            margin: 24px auto 50px;
            align-items: start;
        }

        .controls-panel {
            background: var(--glass);
            border-radius: 15px;
            box-shadow: var(--panel-shadow);
            border: 1px solid rgba(16, 33, 56, 0.12);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 16px;
        }

        .diagram-container {
            flex: 1;
            background: var(--glass);
            padding: 20px;
            border-radius: 15px;
            box-shadow: var(--panel-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
            position: relative;
            overflow: hidden;
            perspective: 1200px;
        }

        .diagram-container::before {
            content: "";
            position: absolute;
            inset: -30%;
            background: conic-gradient(from 120deg, rgba(28, 141, 231, 0.14), rgba(214, 58, 102, 0.06), rgba(16, 33, 56, 0.11));
            filter: blur(20px);
            animation: swirl 16s linear infinite;
            z-index: 0;
        }

        .diagram-stage {
            width: min(430px, 100%);
            aspect-ratio: 1 / 1;
            position: relative;
            transform-style: preserve-3d;
            animation: floatStage 5s ease-in-out infinite;
            z-index: 1;
        }

        .svg-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
            transform-origin: top left;
            will-change: transform;
            pointer-events: none;
        }

        .anatomy-frame {
            position: relative;
            width: min(100%, 400px);
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            pointer-events: auto;
        }

        .male-frame {
            aspect-ratio: 322 / 507;
            width: min(92%, 360px);
        }

        .female-frame {
            aspect-ratio: 4210 / 3256;
        }

        .scanline {
            position: absolute;
            left: 8%;
            right: 8%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
            top: 18%;
            animation: scan 3.2s ease-in-out infinite;
            z-index: 2;
            pointer-events: none;
        }

        .organ-popup {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%) translateY(16px);
            width: min(92%, 520px);
            padding: 16px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(16, 33, 56, 0.15);
            box-shadow: 0 14px 28px rgba(16, 33, 56, 0.22);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s ease, opacity 0.35s ease;
            z-index: 3;
            backdrop-filter: blur(4px);
        }

        .organ-popup.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .organ-popup h3 {
            margin: 0 0 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            color: var(--accent-male);
            line-height: 1.2;
        }

        .female-mode .organ-popup h3 {
            color: var(--accent-female);
        }

        .organ-popup p {
            margin: 0;
            color: #45505c;
            line-height: 1.55;
            font-size: 0.98rem;
        }

        #popup-phys {
            margin-top: 8px;
            font-style: italic;
            color: var(--ink-soft);
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 18px 22px rgba(16, 33, 56, 0.24));
        }

        .anatomy-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            z-index: 1;
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .clickable-region {
            cursor: pointer;
            transition: opacity 0.2s ease;
            opacity: 0;
        }

        .clickable-region:hover {
            opacity: 0.15 !important;
        }

        .organ-path {
            fill: #b8c2cc;
            stroke: #fff;
            stroke-width: 2;
            cursor: pointer;
            transition: 0.26s ease;
        }

        .organ-path:hover {
            fill: #9daab6 !important;
            filter: brightness(1.06);
        }

        .organ-path:focus-visible {
            outline: none;
            stroke: #ffffff;
            stroke-width: 3;
            filter: brightness(1.16);
        }

        .hidden { display: none; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .active-part {
            animation: pulse 0.5s ease-in-out;
            fill: var(--accent-male) !important;
            filter: drop-shadow(0 0 6px rgba(28, 141, 231, 0.65));
        }
        .female-mode .active-part {
            fill: var(--accent-female) !important;
            filter: drop-shadow(0 0 6px rgba(214, 58, 102, 0.65));
        }

        .zooming .organ-path:not(.active-part) {
            opacity: 0.3;
        }

        @keyframes floatStage {
            0%, 100% { transform: rotateX(8deg) rotateY(-5deg) translateY(0px); }
            50% { transform: rotateX(10deg) rotateY(6deg) translateY(-10px); }
        }

        @keyframes swirl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes scan {
            0%, 100% { top: 18%; opacity: 0.55; }
            50% { top: 84%; opacity: 1; }
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
                width: min(94%, 1160px);
                margin-top: 14px;
            }

            .controls-panel {
                position: static;
            }

            .toggle-container,
            .view-toggle {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .diagram-container {
                min-height: 420px;
            }

            .organ-popup {
                width: min(94%, 440px);
                padding: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .diagram-stage,
            .scanline,
            .diagram-container::before,
            .svg-wrapper,
            .organ-popup,
            .btn {
                animation: none !important;
                transition: none !important;
            }
        }

    </style>
</head>

                    name: "Uterus (Womb)",
                    desc: "A hollow, pear-shaped organ located in the female pelvis.",
                    phys: "Physiology: The site of fetal development during pregnancy. Its lining (endometrium) sheds during menstruation."
                },
                cervix: {
                    name: "Cervix",
                    desc: "The lower, narrow part of the uterus that connects to the vagina.",
                    phys: "Physiology: Acts as a passage between uterus and vagina; cervical mucus changes through the cycle and the cervix dilates during labor."
                },
                "ovary-l": {
                    name: "Ovaries",
                    desc: "Small, oval-shaped glands located on either side of the uterus.",
                    phys: "Physiology: They produce eggs (ova) and hormones like estrogen and progesterone."
                },
                "ovary-r": {
                    name: "Ovaries",
                    desc: "Small, oval-shaped glands located on either side of the uterus.",
                    phys: "Physiology: They produce eggs (ova) and hormones like estrogen and progesterone."
                },
                vagina: {
                    name: "Vagina",
                    desc: "A muscular, hollow tube that extends from the vaginal opening to the cervix.",
                    phys: "Physiology: Acts as the birth canal and the pathway for menstrual flow."
                },
                "fallopian-l": {
                    name: "Fallopian Tubes",
                    desc: "Narrow tubes that are attached to the upper part of the uterus.",
                    phys: "Physiology: Serve as tunnels for the ova to travel from the ovaries to the uterus. Fertilization usually occurs here."
                },
                "fallopian-r": {
                    name: "Fallopian Tubes",
                    desc: "Narrow tubes that are attached to the upper part of the uterus.",
                    phys: "Physiology: Serve as tunnels for the ova to travel from the ovaries to the uterus. Fertilization usually occurs here."
                }
            },
            external: {
                "mons-veneris": {
                    name: "Mons Veneris",
                    desc: "A soft fatty mound covering the pubic bone above the vulva.",
                    phys: "Physiology: Provides a protective cushion over the pubic bone and becomes more prominent at puberty."
                },
                "labia-majora-l": {
                    name: "Labia Majora",
                    desc: "The outer folds of skin that surround and protect the vulva.",
                    phys: "Physiology: Help protect the deeper external genital structures from friction and infection."
                },
                "labia-majora-r": {
                    name: "Labia Majora",
                    desc: "The outer folds of skin that surround and protect the vulva.",
                    phys: "Physiology: Help protect the deeper external genital structures from friction and infection."
                },
                "labia-minora-l": {
                    name: "Labia Minora",
                    desc: "The smaller inner folds that frame the vestibule.",
                    phys: "Physiology: Help protect the urethral and vaginal openings and increase blood flow during arousal."
                },
                "labia-minora-r": {
                    name: "Labia Minora",
                    desc: "The smaller inner folds that frame the vestibule.",
                    phys: "Physiology: Help protect the urethral and vaginal openings and increase blood flow during arousal."
                },
                clitoris: {
                    name: "Clitoris",
                    desc: "A small, highly sensitive erectile structure located at the top of the vulva.",
                    phys: "Physiology: Contains a dense concentration of nerve endings and plays an important role in sexual sensation."
                },
                vestibule: {
                    name: "Vestibule",
                    desc: "The area inside the labia minora where the openings are located.",
                    phys: "Physiology: Houses the urethral opening and vaginal opening and serves as a protected entry space."
                },
                "urethral-opening": {
                    name: "Urethral Opening",
                    desc: "The external opening where urine leaves the body.",
                    phys: "Physiology: Provides the exit for urine from the bladder."
                },
                "vaginal-opening": {
                    name: "Vaginal Opening (Introitus)",
                    desc: "The entrance to the vaginal canal.",
                    phys: "Physiology: Serves as the lower opening of the reproductive tract and part of the birth canal."
                },
                perineum: {
                    name: "Perineum",
                    desc: "The area of skin and muscle between the vaginal opening and the anus.",
                    phys: "Physiology: Supports the pelvic floor and contributes to stability of the pelvic organs."
                }
            }
        }
    };

    let currentSystem = 'male';
    let maleView = 'external';
    let femaleView = 'internal';
    let selectedPart = null;

    function getActiveDataset() {
        if (currentSystem === 'male') {
            return data.male[maleView];
        }
        return data.female[femaleView];
    }

    function getModeText() {
        if (currentSystem === 'male') {
            return `Male ${maleView.charAt(0).toUpperCase() + maleView.slice(1)}`;
        }
        return `Female ${femaleView.charAt(0).toUpperCase() + femaleView.slice(1)}`;
    }

    function updateStatus() {
        const dataset = getActiveDataset();
        const selectedText = selectedPart && dataset[selectedPart] ? dataset[selectedPart].name : 'None';
        document.getElementById('status-pill').innerText = `Mode: ${getModeText()} | Selected: ${selectedText}`;
    }

    function setActiveModeButton() {
        const maleBtn = document.getElementById('male-btn');
        const femaleBtn = document.getElementById('female-btn');
        maleBtn.classList.toggle('is-active', currentSystem === 'male');
        femaleBtn.classList.toggle('is-active', currentSystem === 'female');
    }

    function setActiveMaleViewButton() {
        const internalBtn = document.getElementById('male-internal-btn');
        const externalBtn = document.getElementById('male-external-btn');
        if (!internalBtn || !externalBtn) {
            return;
        }
        internalBtn.classList.toggle('is-active', currentSystem === 'male' && maleView === 'internal');
        externalBtn.classList.toggle('is-active', currentSystem === 'male' && maleView === 'external');
    }

    function setActiveFemaleViewButton() {
        const internalBtn = document.getElementById('female-internal-btn');
        const externalBtn = document.getElementById('female-external-btn');
        if (!internalBtn || !externalBtn) {
            return;
        }
        internalBtn.classList.toggle('is-active', currentSystem === 'female' && femaleView === 'internal');
        externalBtn.classList.toggle('is-active', currentSystem === 'female' && femaleView === 'external');
    }

    function setPopup(info) {
        const popup = document.getElementById('organ-popup');

        if (!info) {
            popup.classList.remove('show');
            document.getElementById('popup-title').innerText = 'Select an Organ';
            document.getElementById('popup-desc').innerText = 'Click on a highlighted organ to center it and view the description.';
            document.getElementById('popup-phys').innerText = 'Scientific data will appear here.';
            return;
        }

        document.getElementById('popup-title').innerText = info.name;
        document.getElementById('popup-desc').innerText = info.desc;
        document.getElementById('popup-phys').innerText = info.phys;
        popup.classList.add('show');
    }

    function resetView() {
        const frames = document.querySelectorAll('.anatomy-frame');
        frames.forEach(frame => {
            frame.style.transform = 'translate(0px, 0px) scale(1)';
            frame.classList.remove('zooming');
        });
    }

    function resetSelection() {
        selectedPart = null;
        setPopup(null);
        document.querySelectorAll('.organ-path').forEach(p => p.classList.remove('active-part'));
        resetView();
        updateStatus();
    }

    function applyView() {
        const app = document.getElementById('app-container');
        const maleExternalWrap = document.getElementById('male-external-wrapper');
        const maleInternalWrap = document.getElementById('male-internal-wrapper');
        const femaleInternalWrap = document.getElementById('female-internal-wrapper');
        const femaleExternalWrap = document.getElementById('female-external-wrapper');
        const maleViewToggle = document.getElementById('male-view-toggle');
        const femaleViewToggle = document.getElementById('female-view-toggle');

        app.classList.toggle('female-mode', currentSystem === 'female');
        maleExternalWrap.classList.toggle('hidden', !(currentSystem === 'male' && maleView === 'external'));
        maleInternalWrap.classList.toggle('hidden', !(currentSystem === 'male' && maleView === 'internal'));
        femaleInternalWrap.classList.toggle('hidden', !(currentSystem === 'female' && femaleView === 'internal'));
        femaleExternalWrap.classList.toggle('hidden', !(currentSystem === 'female' && femaleView === 'external'));
        maleViewToggle.classList.toggle('hidden', currentSystem !== 'male');
        femaleViewToggle.classList.toggle('hidden', currentSystem !== 'female');

        setActiveModeButton();
        setActiveMaleViewButton();
        setActiveFemaleViewButton();
        updateStatus();
    }

    function focusOnPart(partElement) {
        const frame = partElement.ownerSVGElement.parentElement;
        const box = partElement.getBBox();
        const svg = partElement.ownerSVGElement;
        const view = svg.viewBox.baseVal;
        const centerX = box.x + box.width / 2;
        const centerY = box.y + box.height / 2;
        const dominantSize = Math.max(box.width, box.height);
        const zoom = Math.min(2.3, Math.max(1.55, 64 / dominantSize));

        const frameW = frame.clientWidth;
        const frameH = frame.clientHeight;
        const unitX = frameW / view.width;
        const unitY = frameH / view.height;
        const targetX = centerX * unitX;
        const targetY = centerY * unitY;
        const translateX = frameW / 2 - targetX * zoom;
        const translateY = frameH / 2 - targetY * zoom;

        frame.style.transform = `translate(${translateX}px, ${translateY}px) scale(${zoom})`;
        frame.classList.add('zooming');
    }

    function switchSystem(system) {
        currentSystem = system;
        if (system === 'male') {
            maleView = 'external';
        }
        if (system === 'female') {
            femaleView = 'external';
        }
        resetSelection();
        applyView();
    }

    function switchMaleView(view) {
        if (currentSystem !== 'male') {
            currentSystem = 'male';
        }
        maleView = view;
        resetSelection();
        applyView();
    }

    function switchFemaleView(view) {
        if (currentSystem !== 'female') {
            currentSystem = 'female';
        }
        femaleView = view;
        resetSelection();
        applyView();
    }

    function getZoomTarget(partElement) {
        if (partElement.id === 'urethral-opening-male') {
            return document.getElementById('glans') || partElement;
        }
        return partElement;
    }

    document.querySelectorAll('.organ-path').forEach(path => {
        path.setAttribute('tabindex', '0');
        path.setAttribute('role', 'button');
        path.setAttribute('aria-label', path.id.replace(/-/g, ' '));

        path.addEventListener('click', function() {
            const zoomTarget = getZoomTarget(this);
            const preserveZoom = this.id === 'urethral-opening-male';

            document.querySelectorAll('.organ-path').forEach(p => p.classList.remove('active-part'));
            if (!preserveZoom) {
                resetView();
            }

            this.classList.add('active-part');
            focusOnPart(zoomTarget);
            selectedPart = this.id;

            const info = getActiveDataset()[this.id];
            if (info) {
                setPopup(info);
                updateStatus();
            }
        });

        path.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                this.click();
            }
        });
    });

    document.querySelector('.diagram-container').addEventListener('click', function(event) {
        if (!event.target.classList.contains('organ-path')) {
            resetSelection();
        }
    });

    applyView();
    resetSelection();
</script>
